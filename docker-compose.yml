version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Clinical AI Assistant — local Docker Compose
#
# Prerequisites:
#   1. Copy backend/.env.example → backend/.env and fill in ANTHROPIC_API_KEY
#   2. Build the FAISS index:   python scripts/ingest_data.py
#   3. Train the ML classifier: cd backend && python -m app.ml.train
#
# Start:  docker compose up --build
# Stop:   docker compose down
# Logs:   docker compose logs -f backend
# Reset:  docker compose down -v   (destroys postgres_data volume)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (FastAPI + RAG + Claude) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clinical-ai-backend:local
    container_name: clinical_ai_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override DATABASE_URL to point at the db service (not localhost)
      DATABASE_URL: postgresql://postgres:postgres@db:5432/clinical_ai
      ENVIRONMENT: docker
      # CORS: allow both the nginx frontend and direct browser access
      ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:8000","http://localhost:5173"]'
    volumes:
      # FAISS index and clinical document chunks
      - ./data:/data:ro
      # Trained ML query-route classifier
      - ./models:/models:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    restart: unless-stopped

  # ── Frontend (React → Nginx) ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: clinical-ai-frontend:local
    container_name: clinical_ai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app_net
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: clinical_ai_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinical_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinical_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net
    restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────────────

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data: